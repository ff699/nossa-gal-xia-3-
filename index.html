<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Mari</title>
<style>
  :root{
    --bg-deep:#05040d;
    --bg-mid:#100a24;
    --rose:#ff6fa5;
    --rose-soft:#ffb8d4;
    --violet:#9d6bff;
    --gold:#ffd9a0;
    --ink:#f5eefc;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:
      radial-gradient(ellipse at 50% 30%, var(--bg-mid) 0%, var(--bg-deep) 60%, #020103 100%);
    overflow:hidden;
    font-family: 'Georgia', 'Iowan Old Style', serif;
    color:var(--ink);
    touch-action:none;
    cursor:grab;
    -webkit-user-select:none;
    user-select:none;
  }
  html:active, body:active{ cursor:grabbing; }

  #stars, #heart{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
  }
  #heart{ pointer-events:none; }

  #ui{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }

  #top-scrim, #bottom-scrim{
    position:fixed;
    left:0;
    width:100%;
    pointer-events:none;
    z-index:4000;
  }
  #top-scrim{
    top:0;
    height:128px;
    background: linear-gradient(to bottom, var(--bg-deep) 0%, rgba(5,4,13,.88) 45%, rgba(5,4,13,0) 100%);
  }
  #bottom-scrim{
    bottom:0;
    height:118px;
    background: linear-gradient(to top, var(--bg-deep) 0%, rgba(5,4,13,.88) 45%, rgba(5,4,13,0) 100%);
  }

  header{
    position:absolute;
    top: clamp(16px, 3.6vh, 38px);
    left:0;
    width:100%;
    text-align:center;
    pointer-events:none;
    z-index:6000;
    padding: 0 14px;
  }

  header .kicker{
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--rose-soft);
    opacity:.75;
    margin:0 0 6px 0;
  }

  header h1{
    margin:0;
    font-size: clamp(20px, 4vw, 38px);
    font-weight:400;
    font-style:italic;
    color:var(--ink);
    text-shadow: 0 0 24px rgba(255,110,160,.45);
    letter-spacing: .5px;
  }

  footer{
    position:absolute;
    bottom: clamp(14px, 3.6vh, 32px);
    left:0;
    width:100%;
    text-align:center;
    font-size: 13px;
    color: var(--rose-soft);
    opacity:.6;
    pointer-events:none;
    font-style: italic;
    z-index:6000;
    padding: 0 14px;
  }

  .msg{
    position:absolute;
    top:0; left:0;
    transform: translate(-50%, -50%);
    max-width: 150px;
    padding: 6px 11px;
    font-size: 11.5px;
    line-height:1.35;
    text-align:center;
    color: var(--ink);
    background: rgba(20, 12, 40, 0.4);
    border: 1px solid rgba(255,184,212,.25);
    border-radius: 13px;
    backdrop-filter: blur(2px);
    box-shadow: 0 0 18px rgba(157,107,255,.18);
    white-space: normal;
    pointer-events:auto;
    cursor:pointer;
    will-change: transform, opacity;
    transition: box-shadow .25s ease;
  }
  .msg.highlight{
    box-shadow: 0 0 30px rgba(255,140,180,.85), 0 0 56px rgba(157,107,255,.55);
    border-color: rgba(255,220,235,.6);
  }

  .foto{
    position:absolute;
    top:0; left:0;
    transform: translate(-50%,-50%);
    width:84px;
    text-align:center;
    pointer-events:auto;
    cursor:pointer;
    will-change: transform, opacity;
  }
  .foto .frame{
    width:84px; height:84px;
    border-radius:10px;
    background: linear-gradient(135deg, rgba(157,107,255,.28), rgba(255,110,160,.28));
    border:1px solid rgba(255,255,255,.28);
    box-shadow: 0 0 18px rgba(255,110,160,.22);
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    overflow:hidden;
    transition: box-shadow .25s ease;
  }
  .foto .frame img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .foto.highlight .frame{
    box-shadow: 0 0 32px rgba(255,140,180,.9), 0 0 58px rgba(157,107,255,.55);
  }
  .foto .cap{
    margin-top:5px;
    font-size:10px;
    color:var(--ink);
    opacity:.85;
    font-style:italic;
  }

  #counter{
    margin-top:8px;
    font-family:'Trebuchet MS', sans-serif;
    font-size:11.5px;
    letter-spacing:.4px;
    color: var(--gold);
    opacity:.85;
  }

  #hint{
    position:fixed;
    top: 14px;
    right: 16px;
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 10px;
    color: rgba(245,238,252,.4);
    text-align:right;
    line-height:1.4;
    pointer-events:none;
    z-index:6000;
    opacity:1;
    transition: opacity 1s ease;
    max-width: 150px;
  }
  #hint.fade{ opacity:0; }

  #invite{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
    text-align:center;
    background: radial-gradient(ellipse at 50% 40%, #170d31 0%, #05040d 65%, #020103 100%);
    cursor:pointer;
    transition: opacity .9s ease, visibility .9s ease;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-y;
  }
  #invite.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  #invite-inner{
    max-width:420px;
    margin: auto;
    padding: 8px 0;
  }
  #invite-text{
    font-size: clamp(16px, 5vw, 21px);
    line-height:1.65;
    font-style:italic;
    color:var(--ink);
    text-shadow: 0 0 22px rgba(255,110,160,.35);
    margin: 0 0 28px 0;
    white-space: pre-line;
  }
  #invite-btn{
    font-family:'Trebuchet MS', sans-serif;
    font-size:12.5px;
    letter-spacing:1.5px;
    color:var(--ink);
    background: rgba(255,255,255,.06);
    border:1px solid rgba(255,184,212,.4);
    padding:13px 30px;
    border-radius:30px;
    cursor:pointer;
    transition: background .25s ease, box-shadow .25s ease;
  }
  #invite-btn:hover{
    background: rgba(255,255,255,.12);
    box-shadow: 0 0 22px rgba(255,110,160,.35);
  }

  /* ajustes para telas de celular */
  @media (max-width: 640px){
    #top-scrim{ height:108px; }
    #bottom-scrim{ height:96px; }
    header{ top: 14px; }
    header .kicker{ font-size:10px; letter-spacing:2px; }
    header h1{ font-size: clamp(17px, 5.6vw, 23px); }
    #counter{ font-size:10.5px; margin-top:6px; }
    footer{ font-size:11px; bottom:12px; }
    .msg{ max-width:112px; font-size:10px; padding:5px 8px; border-radius:11px; }
    .foto{ width:64px; }
    .foto .frame{ width:64px; height:64px; font-size:15px; }
    .foto .cap{ font-size:8.5px; margin-top:4px; }
    #hint{ font-size:9px; max-width:110px; top:10px; right:10px; }
    #invite-text{ margin-bottom:24px; }
  }
</style>
</head>
<body>

<div id="invite">
  <div id="invite-inner">
    <!-- posso editar ou quebrar normalmente -->
    <p id="invite-text">Surpresa pro meu amor.

Toque aqui quando estiver pronta pra ver.</p>
    <button id="invite-btn">abrir</button>
  </div>
</div>

<canvas id="stars"></canvas>
<canvas id="heart"></canvas>
<div id="top-scrim"></div>
<div id="bottom-scrim"></div>
<div id="ui">
  <header>
    <p class="kicker">Nossa Galáxia <3 </p>
    <h1 id="title">Para o amor da minha vida</h1>
    <p id="counter"></p>
  </header>
  <footer id="footer">Eu te amo pra sempre mari</footer>
</div>
<div id="hint">arraste para girar • pinça pra dar zoom<br>toca nas mensagens vida</div>

<script>
/* ======================================================
   PERSONALIZAÇÕES
   ====================================================== */
const mensagens = [
  "2021 - eu ainda não sabia, mas a garota que eu achava tão bonita na escola se tornaria a mulher da minha vida um dia",
  "20 de maio - começamos a conversar, e sem perceber uma simples conversa dava origem a uma história linda",
  "21 de junho - nosso primeiro encontro, O dia que eu amei cada segundo e fiquei paralisado de estar com você",
  "4 de julho - o pinguim do linux, entre muitos beijos e carinho existiu minha loucura de falar pra você que eu queria tatuar um pinguim apenas no 2 encontro (porque eu fiz isso? KKKKKK)",
  "9 de julho - o dia no parque, um parque, nós dois e um dia que parecia simples mas por ser com você, qualquer momento simples se torna extremamente especial, eu te amo",
  "3 de agosto - o primeiro 'eu te amo', três palavras que carregam tudo aquilo que não aguentava mais guardar dentro de mim, eu simplesmente te amo um universo inteiro",
  "9 de agosto - nós, o dia que nos tornamos nós dois, o dia em que pude chamar você de minha namorada e sem dúvidas, o 2 melhor dia da minha vida (o primeiro vai ser o casamento) TE AMO",
  "Se você soubesse a beleza que eu vejo em cada detalhe seu... eu te amo",
  "1 em 8.300.678.395, essa é chance de encontrar alguém nesse enorme mundo, e eu te encontrei",
  "você é doce, você é leve e é um sonho, obrigado por ser você",
  "As muitas águas não podem apagar o amor - Cânticos 8:7",
  "Sejam paciente um com o outro e apoiem-se mutualmente em amor - Efésios 4:2",
  "Te vivo",
  "Eu te amo",
  "quero aproveitar para dizer o quanto eu te acho linda, literalmente tudooo em você minha garota"
];

// PERSONALIZAÇÃO DAS FOTOS
// deixe "src" vazio para mostrar um quadro decorativo, ou cole uma URL
// (ou uma imagem em base64) para mostrar a foto de verdade.
const fotos = [ 
  { caption: "Meu amor", src: "mari.jpg" },
  { caption: "a melhor companheira desse universo",  src: "marii.jpg" },
  { caption: "Minha eterna princesa",      src: "mariii.jpg" },
  { caption: "eu e você sempre",         src: "mariiii.jpg" }
];

// data de namoro (se necessário eu edito) (dia, mês, ano)
const inicioNamoro = new Date(2026, 7, 9);

/* ---------- setup ---------- */
const starCanvas = document.getElementById('stars');
const heartCanvas = document.getElementById('heart');
const sctx = starCanvas.getContext('2d');
const hctx = heartCanvas.getContext('2d');

let W, H, cx, cy;
function resize(){
  W = window.innerWidth;
  H = window.innerHeight;
  starCanvas.width = W; starCanvas.height = H;
  heartCanvas.width = W; heartCanvas.height = H;
  cx = W/2; cy = H/2 - 10;
}
window.addEventListener('resize', resize);
resize();

/* ---------- starfield ---------- */
const STAR_COUNT = 260;
const stars = Array.from({length: STAR_COUNT}, () => ({
  x: Math.random()*W,
  y: Math.random()*H,
  r: Math.random()*1.3 + 0.2,
  baseAlpha: Math.random()*0.6 + 0.2,
  tw: Math.random()*Math.PI*2,
  speed: Math.random()*0.02 + 0.01
}));

function drawStars(t){
  sctx.clearRect(0,0,W,H);
  for(const s of stars){
    const alpha = s.baseAlpha + Math.sin(t*s.speed*60 + s.tw)*0.25;
    sctx.beginPath();
    sctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    sctx.fillStyle = `rgba(255,255,255,${Math.max(0,alpha)})`;
    sctx.fill();
  }
}

/* ---------- camera: arrastar gira (yaw/pitch), pinça ou scroll dá zoom ---------- */
const camera = { yaw: 0.5, pitch: 0.32, zoom: 1 };
let lastInteraction = 0;
let inviteVisible = true;
const activePointers = new Map();
let dragLast = null;
let pinchStartDist = null;
let pinchStartZoom = 1;

const inviteEl = document.getElementById('invite');
const hintEl = document.getElementById('hint');
function openInvite(){
  inviteVisible = false;
  inviteEl.classList.add('hide');
  // some tempo depois de abrir, some com a dica de controles pra não poluir a tela
  setTimeout(() => hintEl.classList.add('fade'), 5000);
}
inviteEl.addEventListener('click', openInvite);
document.getElementById('invite-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  openInvite();
});

function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

function onPointerDown(e){
  if(inviteVisible) return;
  activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  lastInteraction = performance.now();
  if(activePointers.size === 1){
    dragLast = {x:e.clientX, y:e.clientY};
  } else if(activePointers.size === 2){
    const pts = [...activePointers.values()];
    pinchStartDist = dist(pts[0], pts[1]);
    pinchStartZoom = camera.zoom;
  }
}

function onPointerMove(e){
  if(inviteVisible) return;
  if(!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  lastInteraction = performance.now();

  if(activePointers.size === 1 && dragLast){
    const dx = e.clientX - dragLast.x;
    const dy = e.clientY - dragLast.y;
    camera.yaw += dx*0.006;
    camera.pitch = Math.max(-1.3, Math.min(1.3, camera.pitch + dy*0.006));
    dragLast = {x:e.clientX, y:e.clientY};
  } else if(activePointers.size === 2 && pinchStartDist){
    const pts = [...activePointers.values()];
    const d = dist(pts[0], pts[1]);
    camera.zoom = Math.max(0.5, Math.min(2.6, pinchStartZoom * (d/pinchStartDist)));
  }
}

function onPointerUp(e){
  activePointers.delete(e.pointerId);
  if(activePointers.size < 2) pinchStartDist = null;
  if(activePointers.size === 1){
    const [p] = activePointers.values();
    dragLast = {x:p.x, y:p.y};
  } else if(activePointers.size === 0){
    dragLast = null;
  }
}

function onWheel(e){
  if(inviteVisible) return;
  e.preventDefault();
  camera.zoom = Math.max(0.5, Math.min(2.6, camera.zoom - e.deltaY*0.0012));
  lastInteraction = performance.now();
}

window.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);
window.addEventListener('wheel', onWheel, {passive:false});

function rotate3D(x,y,z){
  const cosY = Math.cos(camera.yaw), sinY = Math.sin(camera.yaw);
  const x1 = x*cosY - z*sinY;
  const z1 = x*sinY + z*cosY;
  const cosX = Math.cos(camera.pitch), sinX = Math.sin(camera.pitch);
  const y2 = y*cosX - z1*sinX;
  const z2 = y*sinX + z1*cosX;
  return {x:x1, y:y2, z:z2};
}

const FOCAL = 340;
function project(x,y,z){
  const s = (FOCAL/(FOCAL + z + 90)) * camera.zoom;
  return { sx: cx + x*SCALE*s, sy: cy + y*SCALE*s, scale: s, z };
}

/* ---------- 3D heart particle cloud ---------- */
// parametric 2D heart curve, extruded with random depth for a volumetric feel
const SCALE = Math.min(W,H) * 0.017;
const heartPoints = [];

function heartXY(t){
  const x = 16*Math.pow(Math.sin(t),3);
  const y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
  return {x, y};
}

// outline points
const OUTLINE_N = 160;
for(let i=0;i<OUTLINE_N;i++){
  const t = (i/OUTLINE_N)*Math.PI*2;
  const {x,y} = heartXY(t);
  heartPoints.push({ x, y, z:(Math.random()-0.5)*10, r: 1.6 + Math.random()*0.8 });
}
// volumetric fill points
const FILL_N = 900;
for(let i=0;i<FILL_N;i++){
  const t = Math.random()*Math.PI*2;
  const {x,y} = heartXY(t);
  const k = Math.sqrt(Math.random()); // even radial distribution
  heartPoints.push({ x:x*k, y:y*k, z:(Math.random()-0.5)*22, r: 0.7 + Math.random()*1.1 });
}

function drawHeart(){
  hctx.clearRect(0,0,W,H);
  const projected = [];

  for(const p of heartPoints){
    const r = rotate3D(p.x, p.y, p.z);
    const proj = project(r.x, r.y, r.z);
    projected.push({sx:proj.sx, sy:proj.sy, scale:proj.scale, z:proj.z, r:p.r});
  }
  projected.sort((a,b)=> a.z - b.z);

  for(const p of projected){
    const glow = Math.max(0.25, p.scale);
    hctx.beginPath();
    hctx.arc(p.sx, p.sy, p.r*p.scale*1.6, 0, Math.PI*2);
    hctx.fillStyle = `rgba(255, ${100 + Math.floor(glow*80)}, ${150 + Math.floor(glow*60)}, ${0.55*glow})`;
    hctx.shadowColor = 'rgba(255,90,140,0.8)';
    hctx.shadowBlur = 6*glow;
    hctx.fill();
  }
}

/* ---------- mensagens e fotos orbitando juntas (disco 3D inclinável) ---------- */
const container = document.getElementById('ui');
const orbitEls = [];

const itens = [
  ...mensagens.map(text => ({ kind:'msg', text })),
  ...fotos.map(f => ({ kind:'foto', caption:f.caption, src:f.src }))
];

// espalha os itens em anéis organizados ao redor do coração,
// usando o "ângulo dourado" para uma distribuição uniforme (sem amontoados)
const GOLDEN_ANGLE = 2.399963229728653;
const RING_COUNT = 4;

itens.forEach((item, i) => {
  const el = document.createElement('div');

  if(item.kind === 'msg'){
    el.className = 'msg';
    el.textContent = item.text;
  } else {
    el.className = 'foto';
    const frame = document.createElement('div');
    frame.className = 'frame';
    if(item.src){
      const img = document.createElement('img');
      img.src = item.src;
      img.alt = item.caption || '';
      img.onerror = () => { img.remove(); frame.textContent = '🤍'; };
      frame.appendChild(img);
    } else {
      frame.textContent = '🤍';
    }
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = item.caption || '';
    el.appendChild(frame);
    el.appendChild(cap);
  }

  container.appendChild(el);

  const ring = i % RING_COUNT;
  const worldRadius = 30 + ring*10 + (Math.random()*4 - 2);
  const speed = (0.022 + ring*0.004) * (i % 2 === 0 ? 1 : -1);
  const angleOffset = i * GOLDEN_ANGLE;
  const yJitter = (Math.random()-0.5)*8;
  const bob = Math.random()*Math.PI*2;

  const orbit = { el, kind:item.kind, text:item.text||'', worldRadius, speed, angleOffset, yJitter, bob, highlightUntil:0, lastProj:null };

  // toque/clique faz o item brilhar mais forte por um instante
  el.addEventListener('click', () => { orbit.highlightUntil = performance.now()+900; });

  orbitEls.push(orbit);
});

// mensagem "especial" que o cometa vai iluminar ao passar perto
const specialOrbit = orbitEls.find(o => o.text.toLowerCase().includes('eu te amo')) || orbitEls[0];

function drawOrbits(t){
  for(const o of orbitEls){
    const a = o.angleOffset + t*o.speed;
    const x = Math.cos(a)*o.worldRadius;
    const z = Math.sin(a)*o.worldRadius;
    const y = o.yJitter + Math.sin(t*0.6 + o.bob)*1.5;
    const r = rotate3D(x,y,z);
    const proj = project(r.x, r.y, r.z);
    o.lastProj = proj;

    const highlighted = performance.now() < o.highlightUntil;
    const depthFactor = Math.max(0, Math.min(1, (proj.scale - 0.55) / 0.7));
    const opacity = 0.3 + depthFactor*0.65;
    const boost = highlighted ? 1.35 : 1;

    o.el.classList.toggle('highlight', highlighted);
    o.el.style.transform = `translate(-50%,-50%) translate(${proj.sx}px, ${proj.sy}px) scale(${Math.max(0.5, proj.scale)*boost})`;
    o.el.style.opacity = opacity;
    o.el.style.zIndex = Math.floor(proj.scale*1000) + (highlighted ? 2000 : 0);
  }
}

/* ---------- cometa que cruza a tela de vez em quando ---------- */
const COMET_PERIOD = 9;
const COMET_DURATION = 2.3;

function drawComet(t){
  const cyclePos = t % COMET_PERIOD;
  if(cyclePos > COMET_DURATION) return;
  const p = cyclePos / COMET_DURATION;

  const fromX = -60, fromY = H*0.16 + Math.sin(t*0.7)*24;
  const toX = W+60, toY = H*0.86;
  const x = fromX + (toX-fromX)*p;
  const y = fromY + (toY-fromY)*p;

  for(let i=0;i<12;i++){
    const tp = Math.max(0, p - i*0.018);
    const tx = fromX + (toX-fromX)*tp;
    const ty = fromY + (toY-fromY)*tp;
    const alpha = (1 - i/12) * 0.5;
    hctx.beginPath();
    hctx.arc(tx, ty, 2.4*(1-i/12)+0.5, 0, Math.PI*2);
    hctx.fillStyle = `rgba(255,225,180,${alpha})`;
    hctx.fill();
  }

  hctx.beginPath();
  hctx.arc(x, y, 3.2, 0, Math.PI*2);
  hctx.fillStyle = 'rgba(255,245,225,0.95)';
  hctx.shadowColor = 'rgba(255,210,140,0.9)';
  hctx.shadowBlur = 18;
  hctx.fill();
  hctx.shadowBlur = 0;

  if(specialOrbit && specialOrbit.lastProj){
    const d = Math.hypot(x - specialOrbit.lastProj.sx, y - specialOrbit.lastProj.sy);
    if(d < 90) specialOrbit.highlightUntil = performance.now()+700;
  }
}

/* ---------- contador de tempo juntos ---------- */
function updateCounter(){
  const el = document.getElementById('counter');
  const diff = Date.now() - inicioNamoro.getTime();
  if(diff < 0){ el.textContent = ''; return; }
  const dias = Math.floor(diff/86400000);
  const horas = Math.floor((diff%86400000)/3600000);
  const minutos = Math.floor((diff%3600000)/60000);
  el.textContent = `${dias} dias, ${horas}h e ${minutos}min juntos`;
}
updateCounter();
setInterval(updateCounter, 30000);

/* ---------- animation loop ---------- */
let start = null;
function loop(ts){
  if(!start) start = ts;
  const t = (ts - start)/1000;

  if(performance.now() - lastInteraction > 2200){
    camera.yaw += 0.0035; // gira sozinho quando ninguém está mexendo
  }

  drawStars(t);
  drawHeart();
  drawComet(t);
  drawOrbits(t);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
